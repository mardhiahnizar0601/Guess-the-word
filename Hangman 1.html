
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Word!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background: #eaf6ff;
  color: #183b69;
  text-align: center;
}

header {
  background: #245b91;
  color: white;
  padding: 28px 12px;
}

h1 {
  margin: 0;
  font-size: 42px;
}

header p {
  font-size: 18px;
  margin-bottom: 0;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: white;
  border: 3px solid #c5eaff;
  border-radius: 20px;
  padding: 25px 15px;
  box-shadow: 0 5px 12px #cbdce8;
}

.instruction {
  font-size: 22px;
  font-weight: bold;
}

#drawing {
  width: 180px;
  height: 180px;
  margin: 10px auto;
  display: block;
}

#word {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 25px 0;
}

.letter {
  width: 32px;
  height: 45px;
  border-bottom: 4px solid #245b91;
  font-size: 27px;
  font-weight: bold;
}

.space {
  width: 20px;
  border: none;
}

#lives {
  font-size: 20px;
  margin: 15px;
}

#message {
  min-height: 32px;
  font-size: 19px;
  font-weight: bold;
  margin: 15px 0;
}

#keyboard {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  max-width: 480px;
  margin: 20px auto;
}

button {
  border: none;
  border-radius: 10px;
  padding: 13px 5px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.key {
  background: #c7ebff;
  color: #183b69;
}

.key:hover:not(:disabled) {
  background: #8ed5ff;
}

.key:disabled {
  opacity: 0.45;
  cursor: default;
}

.correct {
  background: #9de5b1 !important;
}

.wrong {
  background: #ffc2c2 !important;
}

.action {
  background: #ffdc70;
  color: #183b69;
  padding: 14px 25px;
  margin: 8px;
}

.hint {
  background: #e4efff;
  color: #183b69;
  padding: 14px 25px;
  margin: 8px;
}

footer {
  padding: 18px;
  background: #ffe7b7;
  font-weight: bold;
}

@media (max-width: 500px) {
  h1 {
    font-size: 32px;
  }

  .letter {
    width: 24px;
    font-size: 22px;
  }

  #keyboard {
    gap: 5px;
  }

  button {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎯 Guess the Word! 🎯</h1>
  <p>Choose the correct letters to solve the mystery!</p>
</header>

<div class="container">
  <div class="card">

    <p class="instruction">Can you guess the hidden phrase?</p>
    <p>Click a letter below to reveal the word.</p>

    <svg id="drawing" viewBox="0 0 180 180"
         role="img" aria-label="Hangman drawing">

      <g stroke="#70452f" stroke-width="7"
         stroke-linecap="round" fill="none">
        <path d="M20 160 H155 M45 160 V15 H120 M45 15 H105 M105 15 V32"/>
      </g>

      <g stroke="#e45b5b" stroke-width="5"
         stroke-linecap="round" fill="none">
        <circle id="head" cx="105" cy="48" r="16"
                visibility="hidden"/>
        <path id="body" d="M105 64 V105"
              visibility="hidden"/>
        <path id="leftArm" d="M105 75 L82 92"
              visibility="hidden"/>
        <path id="rightArm" d="M105 75 L128 92"
              visibility="hidden"/>
        <path id="leftLeg" d="M105 105 L86 132"
              visibility="hidden"/>
        <path id="rightLeg" d="M105 105 L124 132"
              visibility="hidden"/>
      </g>
    </svg>

    <div id="word"></div>

    <div id="lives">❤️ Lives left: 6</div>

    <div id="message" aria-live="polite">
      Let's start guessing!
    </div>

    <div id="keyboard"></div>

    <button class="hint" onclick="showHint()">💡 Hint</button>
    <button class="action" onclick="startGame()">🔄 Play Again</button>

  </div>
</div>

<footer>
  ⭐ Keep trying! You can do it! ⭐
</footer>

<script>
const answer = "CLASSROOM OBJECTS";
const givenLetters = ["C", "O"];
const maxMistakes = 6;

let guessed = new Set(givenLetters);
let mistakes = 0;
let finished = false;

const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

const parts = [
  "head",
  "body",
  "leftArm",
  "rightArm",
  "leftLeg",
  "rightLeg"
];

function startGame() {
  guessed = new Set(givenLetters);
  mistakes = 0;
  finished = false;

  document.getElementById("message").textContent =
    "Let's start guessing!";

  renderWord();
  renderKeyboard();
  updateDrawing();
  updateLives();
}

function renderWord() {
  const container = document.getElementById("word");
  container.innerHTML = "";

  for (const letter of answer) {
    const span = document.createElement("span");

    if (letter === " ") {
      span.className = "letter space";
    } else {
      span.className = "letter";
      span.textContent =
        guessed.has(letter) || finished ? letter : "";
    }

    container.appendChild(span);
  }
}

function renderKeyboard() {
  const keyboard = document.getElementById("keyboard");
  keyboard.innerHTML = "";

  alphabet.forEach(letter => {
    const button = document.createElement("button");
    button.textContent = letter;
    button.className = "key";
    button.type = "button";

    if (guessed.has(letter)) {
      button.disabled = true;
      button.classList.add(
        answer.includes(letter) ? "correct" : "wrong"
      );
    }

    button.addEventListener("click", () => guessLetter(letter));
    keyboard.appendChild(button);
  });
}

function guessLetter(letter) {
  if (finished || guessed.has(letter)) return;

  guessed.add(letter);

  if (answer.includes(letter)) {
    document.getElementById("message").textContent =
      "🎉 Correct! The letter " + letter + " is in the word!";
  } else {
    mistakes++;
    document.getElementById("message").textContent =
      "❌ Sorry! Try another letter.";
  }

  renderWord();
  renderKeyboard();
  updateDrawing();
  updateLives();
  checkResult();
}

function updateDrawing() {
  parts.forEach((part, index) => {
    document.getElementById(part).setAttribute(
      "visibility",
      mistakes > index ? "visible" : "hidden"
    );
  });
}

function updateLives() {
  document.getElementById("lives").textContent =
    "❤️ Lives left: " + (maxMistakes - mistakes);
}

function checkResult() {
  const letters = answer.replace(/ /g, "").split("");
  const won = letters.every(letter => guessed.has(letter));

  if (won) {
    finished = true;
    renderWord();
    renderKeyboard();

    document.getElementById("message").textContent =
      "🎉 Excellent! You guessed CLASSROOM OBJECTS!";
    return;
  }

  if (mistakes >= maxMistakes) {
    finished = true;
    renderWord();
    renderKeyboard();

    document.getElementById("message").textContent =
      "Game over! The answer is CLASSROOM OBJECTS.";
  }
}

function showHint() {
  if (finished) return;

  document.getElementById("message").textContent =
    "💡 Hint: Things we use in our classroom!";
}

document.addEventListener("keydown", function(event) {
  const letter = event.key.toUpperCase();

  if (/^[A-Z]$/.test(letter)) {
    guessLetter(letter);
  }
});

startGame();
</script>

</body>
</html>
